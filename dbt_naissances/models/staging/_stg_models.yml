version: 2

models:
  - name: stg_cdc_naissances
    description: "Naissances vivantes aux États-Unis par année et tranche d'âge native de la mère (CDC WONDER)."
    columns:
      - name: annee
        description: "Année de naissance (1995 à 2024)."
        data_tests:
          - not_null
      - name: tranche_age_native
        description: "Tranche d'âge de la mère, libellé CDC."
        data_tests:
          - not_null
      - name: nb_naissances
        description: "Nombre de naissances vivantes."
        data_tests:
          - not_null

  - name: stg_cdc_naissances_education
    description: "Naissances vivantes par année, tranche d'âge native et niveau d'éducation natif de la mère (CDC WONDER)."
    columns:
      - name: annee
        description: "Année de naissance."
        data_tests:
          - not_null
      - name: education_native
        description: "Niveau d'éducation, libellé CDC. Doit exister dans ref_education_harmonisation."
        data_tests:
          - not_null
          - relationships:
              to: ref('ref_education_harmonisation')
              field: education_native
      - name: nb_naissances
        description: "Nombre de naissances vivantes."
        data_tests:
          - not_null
